<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Online</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  @media (max-width: 900px) {
    /* Fix the hamburger button */
    .hamburger-btn {
      display: flex !important;
      position: fixed !important;
      top: 15px !important;
      left: 15px !important;
      z-index: 1001 !important;
      background: rgba(20, 26, 38, 0.9) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      color: #fff !important;
      width: 44px !important;
      height: 44px !important;
      border-radius: 12px !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Hide the sidebar off-screen */
    .sidebar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      height: 100vh !important;
      width: 260px !important;
      transform: translateX(-100%) !important;
      transition: transform 0.3s ease !important;
      z-index: 1000 !important;
      margin: 0 !important;
    }

    /* Slide it in */
    .sidebar.open {
      transform: translateX(0) !important;
    }

    /* The dark overlay */
    .sidebar-overlay {
      display: none;
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0,0,0,0.7) !important;
      z-index: 999 !important;
    }
    .sidebar-overlay.open {
      display: block !important;
    }

    /* Main content fixes */
    .main-content {
      margin-left: 0 !important;
      width: 100% !important;
      padding: 80px 15px 20px !important;
    }
  }
</style>


<style>
  /* FORCE HAMBURGER BUTTON POSITION */
  .hamburger-btn {
    display: none;
    position: fixed !important;
    top: 15px !important;
    left: 15px !important;
    z-index: 99999 !important;
    background: rgba(20, 26, 38, 0.9) !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    color: #fff !important;
    width: 44px !important;
    height: 44px !important;
    border-radius: 12px !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
  }

  @media (max-width: 900px) {
    .hamburger-btn {
      display: flex !important;
    }
    .sidebar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      height: 100vh !important;
      transform: translateX(-100%) !important;
      transition: transform 0.3s ease !important;
      z-index: 1000 !important;
    }
    .sidebar.open {
      transform: translateX(0) !important;
    }
    .sidebar-overlay {
      display: none;
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0,0,0,0.7) !important;
      z-index: 999 !important;
    }
    .sidebar-overlay.open {
      display: block !important;
    }
    .main-content {
      margin-left: 0 !important;
      width: 100% !important;
      padding: 80px 15px 20px !important;
    }
  }
</style>

</head>

<body>

  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>




  
  

    
    
    
    
    

    
    
    <aside class="sidebar">
        <a href="/" class="brand"><span class="brand-mark">♞</span><span class="brand-name">CHESS</span></a>
        <a href="/" class="nav-item active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg> Home</a>
        <a href="/game.html" class="nav-item"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Play</a>
        <a href="/history.html#live" class="nav-item"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#ef4444" fill="rgba(239, 68, 68, 0.2)"/><path d="M12 8v4l3 3" stroke="#ef4444"/></svg> Live Games</a>

        <div class="sidebar-footer">Better moves.<br>Bigger goals.</div>

    <main class="main-content">
        <div class="layout">
            <section class="lobby">
                <div class="hero">
                    <span class="eyebrow">REAL-TIME MULTIPLAYER</span>
                    <h1>Play Chess <em>Online</em></h1>
                    <p>Create a private room or join your friend.</p>
                </div>

                <div id="resumeCard" class="card hidden" style="text-align:center;">
                    <div class="card-head" style="justify-content:center; border:none;">
                        <span class="label" style="color:#22c55e; font-size:14px;">GAME IN PROGRESS</span>
                    </div>
                    <h2 style="font-size:24px; margin-bottom:8px;">You are already in a match!</h2>
                    <p style="color:#8a94a6; font-size:14px; margin-bottom:24px;">Room code: <strong style="color:#22c55e; letter-spacing:2px; font-size:18px;" id="resumeCode">------</strong></p>
                    <button type="button" onclick="window.location.href='/game.html'" class="btn btn-primary" style="width:100%; margin-bottom:12px; font-size:16px;">↻ Resume Game</button>
                    <button type="button" onclick="quitGame()" class="btn btn-danger" style="width:100%;">Quit & Start New</button>
                </div>

                <div id="lobbyCard" class="card">
                    <div class="card-head">
                        <span class="label">START A MATCH</span>
                        <span class="icon">♔</span>
                    </div>
                    <label class="field-label">YOUR NAME</label>
                    <input type="text" id="playerName" class="text-input" placeholder="Enter name" maxlength="24">
                    <button type="button" id="createBtn" class="btn btn-primary btn-create">Create New Room <span class="arrow">→</span></button>
                    <div class="divider">OR JOIN EXISTING</div>
                    <label class="field-label">ROOM CODE</label>
                    <div class="join-row">
                        <input type="text" id="roomCode" class="text-input code-input" placeholder="6-CHAR" maxlength="6">
                        <button type="button" id="joinBtn" class="btn btn-secondary">Join</button>
                    </div>
                    <div id="lobbyError" class="error-text"></div>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let savedCode = sessionStorage.getItem("chessRoomCode");
            
            // Clean up bad codes (like '------' or empty strings)
            if (savedCode && (savedCode === "------" || savedCode.trim().length !== 6)) {
                sessionStorage.removeItem("chessRoomCode");
                sessionStorage.removeItem("chessPlayerToken");
                savedCode = null;
            }

            const resumeCard = document.getElementById("resumeCard");
            const lobbyCard = document.getElementById("lobbyCard");

            if (savedCode) {
                document.getElementById("resumeCode").textContent = savedCode;
                resumeCard.classList.remove("hidden");
                lobbyCard.style.display = "none";
            } else {
                resumeCard.classList.add("hidden");
                lobbyCard.style.display = "block";
            }
        });

        function quitGame() {
            sessionStorage.removeItem("chessRoomCode");
            sessionStorage.removeItem("chessPlayerToken");
            window.location.reload();
        }
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>







<script>
  document.addEventListener('DOMContentLoaded', () => {
    const hamburgerBtn = document.querySelector('.hamburger-btn');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    if (hamburgerBtn && sidebar && overlay) {
      function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
        
        // Toggle a class on the body to track sidebar state
        document.body.classList.toggle('sidebar-open', sidebar.classList.contains('open'));
      }

      hamburgerBtn.addEventListener('click', toggleSidebar);
      overlay.addEventListener('click', toggleSidebar);

      // Auto-close sidebar when clicking a nav link on mobile
      const navLinks = document.querySelectorAll('.sidebar .nav-item');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          if (sidebar.classList.contains('open')) {
            toggleSidebar();
          }
        });
      });
    }
  });
</script>

</body>
</html>
