    /* ============ SHARED PREMIUM UI ============ */
    body { background: #0a0d14; color: #fff; display: flex; min-height: 100vh; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 240px; background: rgba(14, 18, 27, 0.9); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 24px 0; z-index: 10; }
    .sidebar .brand { padding: 0 24px 32px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; color: #fff; text-decoration: none; }
    .sidebar .brand-mark { color: #22c55e; font-size: 28px; }
    .nav-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; color: #8a94a6; font-weight: 500; text-decoration: none; transition: all 0.2s; cursor: pointer; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.03); }
    .nav-item.active { color: #fff; background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; font-weight: 600; }
    .nav-item svg { width: 18px; height: 18px; }
    .sidebar-footer { margin-top: auto; padding: 24px; color: #4a5568; font-size: 12px; line-height: 1.5; }

    /* Main Content */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; background: radial-gradient(circle at top right, rgba(34, 197, 94, 0.15), transparent 40%); display: flex; flex-direction: column; }
    
    .user-profile { position: absolute; top: 30px; right: 30px; width: 40px; height: 40px; border-radius: 50%; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); display: flex; align-items: center; justify-content: center; color: #22c55e; z-index: 20; }

    /* Fix Layout inside new Main */
    .layout { max-width: 1120px; margin: 0 auto; width: 100%; padding: 0; flex: 1; display: flex; flex-direction: column; }
    
    /* Panels */
    .panel { background: rgba(20, 26, 38, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .panel-head { border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
    .panel-head .label { color: #8a94a6; }
    
    /* Buttons */
    .btn-primary { background: #22c55e; color: #000; border: none; font-weight: 700; }
    .btn-primary:hover { background: #16a34a; }
    .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    
    .text-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; }
    .text-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
    
    /* Mobile */
    @media (max-width: 900px) {
      body { flex-direction: column; overflow: auto; }
      .sidebar { width: 100%; padding: 16px; flex-direction: row; justify-content: space-between; align-items: center; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
      .sidebar .brand { padding: 0; }
      .nav-item { display: none; }
      .main-content { padding: 20px; }
      .user-profile { display: none; }
    }
</style>

  <script src="/chess.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    function cModal({ title, message, okText, cancelText, danger = false }) {
      const isAr = document.cookie.split('; ').some(c => c === 'lang=ar');
      const bg = document.createElement("div");
      bg.className = "chess-modal-backdrop open";
      bg.innerHTML = '<div class="chess-modal" dir="' + (isAr ? 'rtl' : 'ltr') + '"><h3>' + (title || (isAr ? 'تأكيد' : 'Confirm')) + '</h3><p>' + (message || '') + '</p><div class="chess-modal-actions">' + (cancelText !== null ? '<button class="chess-modal-btn" data-action="cancel">' + (cancelText || (isAr ? 'إلغاء' : 'Cancel')) + '</button>' : '') + '<button class="chess-modal-btn ' + (danger ? 'danger' : 'primary') + '" data-action="ok">' + (okText || (isAr ? 'موافق' : 'OK')) + '</button></div></div>';
      document.body.appendChild(bg);
      return new Promise(function(resolve) {
        bg.addEventListener('click', function(e) {
          var btn = e.target.closest('[data-action]');
          if (btn) { bg.remove(); resolve(btn.dataset.action === 'ok'); }
          else if (e.target === bg) { bg.remove(); resolve(false); }
        });
      });
    }
    const PIECES = {
    wk: "/pieces/cburnett/wK.svg",
    wq: "/pieces/cburnett/wQ.svg",
    wr: "/pieces/cburnett/wR.svg",
    wb: "/pieces/cburnett/wB.svg",
    wn: "/pieces/cburnett/wN.svg",
    wp: "/pieces/cburnett/wP.svg",
    bk: "/pieces/cburnett/bK.svg",
    bq: "/pieces/cburnett/bQ.svg",
    br: "/pieces/cburnett/bR.svg",
    bb: "/pieces/cburnett/bB.svg",
    bn: "/pieces/cburnett/bN.svg",
    bp: "/pieces/cburnett/bP.svg",
  };
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    let moves = [];
    let moveTimes = [];
    let currentStep = 0;
    let playing = false;
    let playTimer = null;
    let tickTimer = null;
    let liveWUsed = 0;
    let liveBUsed = 0;
    let speedMode = 'realtime';
    let gameMeta = null;
    let lastMoveSquares = { from: null, to: null };

    function fmtMoveTime(ms) {
      if (typeof ms !== "number" || ms < 0) return "";
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return m + ":" + String(sec).padStart(2, "0");
    }
    function fmtClock(sec) {
      if (typeof sec !== "number") return "10:00";
      return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
    }

    function setSpeed(mode) {
      speedMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      if (playing) { clearTimeout(playTimer); scheduleNext(); }
    }

    function renderBoardFromFen(fen) {
      const lm = computeLastMove(currentStep);
      const g = new Chess(fen);
      const boardEl = $("board");
      boardEl.innerHTML = "";
      const rows = g.board();
      const map = {};
      rows.forEach((row, ri) => row.forEach((p, fi) => {
        if (p) map["abcdefgh"[fi] + (8 - ri)] = p;
      }));
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const sq = "abcdefgh"[f] + (8 - r);
          const piece = map[sq];
          const light = ((f + (8-r)) % 2 === 0);
          const cell = document.createElement("div");
          cell.className = "square " + (light ? "light" : "dark");
          if (sq === lm.from || sq === lm.to) cell.classList.add("replay-last-move");
          if (piece) {
            const span = document.createElement("span");
            span.className = "piece " + (piece.color === "w" ? "white" : "black");
            span.innerHTML = `<img src="${PIECES[piece.color + piece.type]}" alt="" style="width:100%;height:100%;object-fit:contain;pointer-events:none" />`;
            cell.appendChild(span);
          }
          boardEl.appendChild(cell);
        }
      }
    }

    function computeLastMove(step) {
      if (step === 0 || moveTimes.length === 0) return { from: null, to: null };
      const g = new Chess();
      let last = null;
      for (let i = 0; i < step; i++) {
        try { last = g.move(moves[i]); } catch(e) { break; }
      }
      return { from: last ? last.from : null, to: last ? last.to : null };
    }

    function computeFenAtStep(step) {
      const g = new Chess();
      for (let i = 0; i < step; i++) {
        try { g.move(moves[i]); } catch(e) { break; }
      }
      return g.fen();
    }

    function computeExactUsed() {
      let wUsed = 0;
      let bUsed = 0;
      for (let i = 0; i < currentStep; i++) {
        const prev = i > 0 ? moveTimes[i - 1] : 0;
        const now = moveTimes[i];
        if (typeof now !== "number") return { wUsed, bUsed };
        const spent = Math.max(0, (now - prev) / 1000);
        if (i % 2 === 0) wUsed += spent;
        else bUsed += spent;
      }
      return { wUsed, bUsed };
    }

    function paintClocks() {
      const whiteRemaining = Math.max(0, 600 - liveWUsed);
      const blackRemaining = Math.max(0, 600 - liveBUsed);
      $("whiteClock").textContent = fmtClock(Math.round(whiteRemaining));
      $("blackClock").textContent = fmtClock(Math.round(blackRemaining));
    }

    function updateClocks() {
      if (!gameMeta) return;
      const ex = computeExactUsed();
      liveWUsed = ex.wUsed;
      liveBUsed = ex.bUsed;
      paintClocks();
    }

    function startTicker() {
      stopTicker();
      tickTimer = setInterval(() => {
        // Who is on the clock? Next move's color.
        // currentStep = number of moves already played. Next move index = currentStep.
        // Even index = white's move (white on clock). Odd = black on clock.
        if (currentStep >= moves.length) return;
        if (currentStep % 2 === 0) liveWUsed += 1;
        else liveBUsed += 1;
        paintClocks();
      }, 1000);
    }

    function stopTicker() {
      if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    }

    function render() {
      renderBoardFromFen(computeFenAtStep(currentStep));
      $("moveLabel").textContent = "Move " + currentStep + " / " + moves.length;
      if (currentStep > 0) {
        const idx = currentStep - 1;
        const t = moveTimes[idx] !== undefined ? " (" + fmtMoveTime(moveTimes[idx]) + ")" : "";
        $("currentMove").textContent = moves[idx] + t;
      } else {
        $("currentMove").textContent = "—";
      }
      $("prevBtn").disabled = currentStep === 0;
      $("nextBtn").disabled = currentStep === moves.length;
      updateClocks();
      const rows = $("moveList").querySelectorAll(".move-pair");
      const activeRow = Math.floor((currentStep - 1) / 2);
      rows.forEach((el, i) => {
        el.style.background = i === activeRow ? "rgba(155,201,108,.15)" : "";
      });
      if (playing) {
        updateClocks();
        startTicker();
      }
    }

    function renderMoveList() {
      const list = $("moveList");
      list.innerHTML = "";
      if (!moves.length) {
        list.innerHTML = '<div class="empty-moves">No moves recorded</div>';
        $("moveCount").textContent = "0 moves";
        return;
      }
      for (let i = 0; i < moves.length; i += 2) {
        const pair = document.createElement("div");
        pair.className = "move-pair";
        const t1 = moveTimes[i] !== undefined ? '<span class="move-time">(' + fmtMoveTime(moveTimes[i]) + ')</span>' : "";
        const t2 = moveTimes[i+1] !== undefined ? '<span class="move-time">(' + fmtMoveTime(moveTimes[i+1]) + ')</span>' : "";
        pair.innerHTML =
          '<span class="move-no">' + (Math.floor(i/2)+1) + '.</span>' +
          '<span class="move-san">' + moves[i] + t1 + '</span>' +
          '<span class="move-san">' + (moves[i+1] || '') + t2 + '</span>';
        list.appendChild(pair);
      }
      $("moveCount").textContent = moves.length + " moves";
    }

    function step(d) {
      currentStep = Math.max(0, Math.min(moves.length, currentStep + d));
      render();
    }

    function togglePlay() {
      if (playing) {
        clearTimeout(playTimer);
        playing = false;
        $("playBtn").textContent = "▶ Play";
        stopTicker();
        return;
      }
      if (currentStep >= moves.length) currentStep = 0;
      playing = true;
      $("playBtn").textContent = "⏸ Pause";
      updateClocks();
      startTicker();
      scheduleNext();
    }

    function scheduleNext() {
      if (!playing) return;
      if (currentStep >= moves.length) {
        playing = false;
        $("playBtn").textContent = "▶ Play";
        stopTicker();
        return;
      }
      let delay;
      if (speedMode === 'realtime') {
        const prevTime = currentStep > 0 ? (moveTimes[currentStep - 1] || 0) : 0;
        const thisTime = moveTimes[currentStep] || (prevTime + 800);
        delay = Math.max(150, thisTime - prevTime);
      } else {
        delay = 800;
      }
      playTimer = setTimeout(() => {
        currentStep++;
        render();
        scheduleNext();
      }, delay);
    }

    async function load() {
      if (!id) { $("result").textContent = "No game id"; return; }
      try {
        const r = await fetch("/api/games/" + id);
        const d = await r.json();
        if (!d.game) { $("result").textContent = "Game not found"; return; }
        const g = d.game;
        gameMeta = g;
        $("whiteName").textContent = g.player_white || "White";
        $("blackName").textContent = g.player_black || "Black";
        $("result").textContent = (g.result || "") + (g.winner ? " — winner: " + g.winner : "");
        moves = (g.moves || "").trim().split(/\s+/).filter(Boolean);
        try { moveTimes = JSON.parse(g.move_times || "[]"); } catch(e) { moveTimes = []; }
        renderMoveList();
        render();
      } catch (e) {
        $("result").textContent = "Failed to load";
      }
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
      if (e.key === " ") { e.preventDefault(); togglePlay(); }
    });

    load();
  </script>
</main>

  <script>

      if (btn && sidebar && overlay) {

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Determine current page and hash
      const path = window.location.pathname;
      const hash = window.location.hash.replace('#', '');
      
      let activeId = '';
      if (path.includes('game.html')) {
        activeId = 'nav-play';
      } else if (path.includes('history.html')) {
        if (hash === 'archived') activeId = 'nav-archived';
        else if (hash === 'live') activeId = 'nav-live';
        else activeId = 'nav-history';
      } else {
        activeId = 'nav-home';
      }

      // Apply active class
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(activeId);
      if (activeEl) activeEl.classList.add('active');
      
      // If on history page, listen for tab changes to update sidebar
      if (path.includes('history.html')) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            const onclickStr = tab.getAttribute('onclick') || '';
            document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
            if (onclickStr.includes('archived')) document.getElementById('nav-archived')?.classList.add('active');
            else if (onclickStr.includes('live')) document.getElementById('nav-live')?.classList.add('active');
            else document.getElementById('nav-history')?.classList.add('active');
          });
        });
      }
    });
  </script>

    document.addEventListener('DOMContentLoaded', () => {
      const path = window.location.pathname;
      const hash = window.location.hash.replace('#', '');
      
      // Remove active from all items first
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));

      // Determine which one should be active
      let activeId = 'nav-home'; // Default
      
      if (path.includes('game.html')) {
        activeId = 'nav-play';
      } else if (path.includes('history.html')) {
        if (hash === 'archived') activeId = 'nav-archived';
        else if (hash === 'live') activeId = 'nav-live';
        else activeId = 'nav-history'; // Default history tab
      } else if (path === '/' || path.includes('index.html')) {
        activeId = 'nav-home';
      } else if (path.includes('replay.html') || path.includes('watch.html')) {
        activeId = 'nav-history'; // Replays belong to history
      }

      // Apply active class
      const activeEl = document.getElementById(activeId);
      if (activeEl) activeEl.classList.add('active');

      // If on history page, listen for tab clicks to update sidebar
      if (path.includes('history.html')) {
        document.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => {
            const onclickStr = tab.getAttribute('onclick') || '';
            document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
            if (onclickStr.includes('archived')) document.getElementById('nav-archived')?.classList.add('active');
            else if (onclickStr.includes('live')) document.getElementById('nav-live')?.classList.add('active');
            else document.getElementById('nav-history')?.classList.add('active');
          });
        });
      }
    });
  </script>
  
</body>
</html>
