<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess — Replay</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .replay-bar{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0;flex-wrap:wrap}
    .replay-bar button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
    .replay-bar button:disabled{opacity:.4;cursor:not-allowed}
    .replay-bar button.primary{background:var(--olive);color:#14200a;border-color:var(--olive)}
    .replay-info{text-align:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
    .replay-info strong{color:var(--ink);font-size:15px}
    .move-time{font-size:10px;color:var(--muted);margin-left:6px;font-weight:400}
    .mode-row{text-align:center;margin:8px 0;font-size:12px;color:var(--muted);display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
    .mode-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:11px;font-weight:700;cursor:pointer}
    .mode-btn.active{background:var(--olive);color:#14200a;border-color:var(--olive)}
    .board-with-players{display:grid;grid-template-columns:140px 1fr 140px;gap:12px;align-items:center;max-width:820px;margin:0 auto}
    .player-side{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
    .player-side .avatar{width:36px;height:36px;border-radius:9px;background:var(--surface-2);color:var(--ink-soft);display:grid;place-items:center;font-size:22px;border:1px solid var(--line)}
    .player-side.white .avatar{background:#eeeed2;color:#1a1410;border-color:#ddd5b8}
    .player-side.black .avatar{background:#3a3834;color:#eeeed2;border-color:#555}
    .player-side .name{font-size:12px;font-weight:700;text-align:center;word-break:break-word;max-width:100%}
    .player-side .clock{font-family:var(--font-mono);font-size:13px;font-weight:700;background:var(--bg-2);color:var(--ink-soft);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
    @media(max-width:640px){
      .board-with-players{grid-template-columns:1fr;gap:8px}
      .player-side{flex-direction:row;justify-content:space-between;padding:8px 12px}
      .player-side .name{text-align:left;font-size:12px}
    }
    }
    </style>
  <link rel="preload" as="image" href="/pieces/cburnett/wK.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/wQ.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/wR.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/wB.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/wN.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/wP.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/bK.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/bQ.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/bR.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/bB.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/bN.svg">
  <link rel="preload" as="image" href="/pieces/cburnett/bP.svg">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand"><span class="brand-mark">♞</span><span class="brand-name">CHESS</span></a>
    <a href="/history.html" class="btn-ghost-sm">← Back to History</a>
  </header>
  <main class="layout">
    <div class="hero" style="margin-bottom:16px">
      <span class="eyebrow">GAME REPLAY</span>
      <h1 style="font-size:32px">Watching the Game</h1>
    </div>

    <div class="replay-info">
      <div id="result"></div>
    </div>

    <div class="mode-row">
      <span>Speed:</span>
      <button class="mode-btn active" data-mode="realtime" onclick="setSpeed('realtime')">⏱ Real time</button>
      <button class="mode-btn" data-mode="fast" onclick="setSpeed('fast')">⚡ Fast (0.8s)</button>
    </div>

    <div class="board-with-players">
      <div class="player-side white">
        <div class="avatar">♔</div>
        <div class="name" id="whiteName">White</div>
        <div class="clock" id="whiteClock">10:00</div>
      </div>
      <div class="board-frame" style="max-width:560px">
        <div id="board" class="board"></div>
      </div>
      <div class="player-side black">
        <div class="avatar">♚</div>
        <div class="name" id="blackName">Black</div>
        <div class="clock" id="blackClock">10:00</div>
      </div>
    </div>

    <div class="replay-bar">
      <button id="prevBtn" onclick="step(-1)">← Prev</button>
      <button id="playBtn" class="primary" onclick="togglePlay()">▶ Play</button>
      <button id="nextBtn" onclick="step(1)">Next →</button>
    </div>
    <div class="replay-info">
      <span id="moveLabel">Move 0 / 0</span> · <span id="currentMove">—</span>
    </div>

    <div class="panel moves-panel" style="margin-top:16px">
      <div class="panel-head">
        <h3>Full Move List</h3>
        <span id="moveCount">—</span>
      </div>
      <div id="moveList" class="move-list"></div>
    </div>
  </main>

  <script src="/chess.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const PIECES = {
    wk: "/pieces/cburnett/wK.svg",
    wq: "/pieces/cburnett/wQ.svg",
    wr: "/pieces/cburnett/wR.svg",
    wb: "/pieces/cburnett/wB.svg",
    wn: "/pieces/cburnett/wN.svg",
    wp: "/pieces/cburnett/wP.svg",
    bk: "/pieces/cburnett/bK.svg",
    bq: "/pieces/cburnett/bQ.svg",
    br: "/pieces/cburnett/bR.svg",
    bb: "/pieces/cburnett/bB.svg",
    bn: "/pieces/cburnett/bN.svg",
    bp: "/pieces/cburnett/bP.svg",
  };
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    let moves = [];
    let moveTimes = [];
    let currentStep = 0;
    let playing = false;
    let playTimer = null;
    let tickTimer = null;
    let liveWUsed = 0;
    let liveBUsed = 0;
    let speedMode = 'realtime';
    let gameMeta = null;
    let lastMoveSquares = { from: null, to: null };

    function fmtMoveTime(ms) {
      if (typeof ms !== "number" || ms < 0) return "";
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return m + ":" + String(sec).padStart(2, "0");
    }
    function fmtClock(sec) {
      if (typeof sec !== "number") return "10:00";
      return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
    }

    function setSpeed(mode) {
      speedMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      if (playing) { clearTimeout(playTimer); scheduleNext(); }
    }

    function renderBoardFromFen(fen) {
      const lm = computeLastMove(currentStep);
      const g = new Chess(fen);
      const boardEl = $("board");
      boardEl.innerHTML = "";
      const rows = g.board();
      const map = {};
      rows.forEach((row, ri) => row.forEach((p, fi) => {
        if (p) map["abcdefgh"[fi] + (8 - ri)] = p;
      }));
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const sq = "abcdefgh"[f] + (8 - r);
          const piece = map[sq];
          const light = ((f + (8-r)) % 2 === 0);
          const cell = document.createElement("div");
          cell.className = "square " + (light ? "light" : "dark");
          if (sq === lm.from || sq === lm.to) cell.classList.add("replay-last-move");
          if (piece) {
            const span = document.createElement("span");
            span.className = "piece " + (piece.color === "w" ? "white" : "black");
            span.innerHTML = `<img src="${PIECES[piece.color + piece.type]}" alt="" style="width:100%;height:100%;object-fit:contain;pointer-events:none" />`;
            cell.appendChild(span);
          }
          boardEl.appendChild(cell);
        }
      }
    }

    function computeLastMove(step) {
      if (step === 0 || moveTimes.length === 0) return { from: null, to: null };
      const g = new Chess();
      let last = null;
      for (let i = 0; i < step; i++) {
        try { last = g.move(moves[i]); } catch(e) { break; }
      }
      return { from: last ? last.from : null, to: last ? last.to : null };
    }

    function computeFenAtStep(step) {
      const g = new Chess();
      for (let i = 0; i < step; i++) {
        try { g.move(moves[i]); } catch(e) { break; }
      }
      return g.fen();
    }

    function computeExactUsed() {
      let wUsed = 0;
      let bUsed = 0;
      for (let i = 0; i < currentStep; i++) {
        const prev = i > 0 ? moveTimes[i - 1] : 0;
        const now = moveTimes[i];
        if (typeof now !== "number") return { wUsed, bUsed };
        const spent = Math.max(0, (now - prev) / 1000);
        if (i % 2 === 0) wUsed += spent;
        else bUsed += spent;
      }
      return { wUsed, bUsed };
    }

    function paintClocks() {
      const whiteRemaining = Math.max(0, 600 - liveWUsed);
      const blackRemaining = Math.max(0, 600 - liveBUsed);
      $("whiteClock").textContent = fmtClock(Math.round(whiteRemaining));
      $("blackClock").textContent = fmtClock(Math.round(blackRemaining));
    }

    function updateClocks() {
      if (!gameMeta) return;
      const ex = computeExactUsed();
      liveWUsed = ex.wUsed;
      liveBUsed = ex.bUsed;
      paintClocks();
    }

    function startTicker() {
      stopTicker();
      tickTimer = setInterval(() => {
        // Who is on the clock? Next move's color.
        // currentStep = number of moves already played. Next move index = currentStep.
        // Even index = white's move (white on clock). Odd = black on clock.
        if (currentStep >= moves.length) return;
        if (currentStep % 2 === 0) liveWUsed += 1;
        else liveBUsed += 1;
        paintClocks();
      }, 1000);
    }

    function stopTicker() {
      if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    }

    function render() {
      renderBoardFromFen(computeFenAtStep(currentStep));
      $("moveLabel").textContent = "Move " + currentStep + " / " + moves.length;
      if (currentStep > 0) {
        const idx = currentStep - 1;
        const t = moveTimes[idx] !== undefined ? " (" + fmtMoveTime(moveTimes[idx]) + ")" : "";
        $("currentMove").textContent = moves[idx] + t;
      } else {
        $("currentMove").textContent = "—";
      }
      $("prevBtn").disabled = currentStep === 0;
      $("nextBtn").disabled = currentStep === moves.length;
      updateClocks();
      const rows = $("moveList").querySelectorAll(".move-pair");
      const activeRow = Math.floor((currentStep - 1) / 2);
      rows.forEach((el, i) => {
        el.style.background = i === activeRow ? "rgba(155,201,108,.15)" : "";
      });
      if (playing) {
        updateClocks();
        startTicker();
      }
    }

    function renderMoveList() {
      const list = $("moveList");
      list.innerHTML = "";
      if (!moves.length) {
        list.innerHTML = '<div class="empty-moves">No moves recorded</div>';
        $("moveCount").textContent = "0 moves";
        return;
      }
      for (let i = 0; i < moves.length; i += 2) {
        const pair = document.createElement("div");
        pair.className = "move-pair";
        const t1 = moveTimes[i] !== undefined ? '<span class="move-time">(' + fmtMoveTime(moveTimes[i]) + ')</span>' : "";
        const t2 = moveTimes[i+1] !== undefined ? '<span class="move-time">(' + fmtMoveTime(moveTimes[i+1]) + ')</span>' : "";
        pair.innerHTML =
          '<span class="move-no">' + (Math.floor(i/2)+1) + '.</span>' +
          '<span class="move-san">' + moves[i] + t1 + '</span>' +
          '<span class="move-san">' + (moves[i+1] || '') + t2 + '</span>';
        list.appendChild(pair);
      }
      $("moveCount").textContent = moves.length + " moves";
    }

    function step(d) {
      currentStep = Math.max(0, Math.min(moves.length, currentStep + d));
      render();
    }

    function togglePlay() {
      if (playing) {
        clearTimeout(playTimer);
        playing = false;
        $("playBtn").textContent = "▶ Play";
        stopTicker();
        return;
      }
      if (currentStep >= moves.length) currentStep = 0;
      playing = true;
      $("playBtn").textContent = "⏸ Pause";
      updateClocks();
      startTicker();
      scheduleNext();
    }

    function scheduleNext() {
      if (!playing) return;
      if (currentStep >= moves.length) {
        playing = false;
        $("playBtn").textContent = "▶ Play";
        stopTicker();
        return;
      }
      let delay;
      if (speedMode === 'realtime') {
        const prevTime = currentStep > 0 ? (moveTimes[currentStep - 1] || 0) : 0;
        const thisTime = moveTimes[currentStep] || (prevTime + 800);
        delay = Math.max(150, thisTime - prevTime);
      } else {
        delay = 800;
      }
      playTimer = setTimeout(() => {
        currentStep++;
        render();
        scheduleNext();
      }, delay);
    }

    async function load() {
      if (!id) { $("result").textContent = "No game id"; return; }
      try {
        const r = await fetch("/api/games/" + id);
        const d = await r.json();
        if (!d.game) { $("result").textContent = "Game not found"; return; }
        const g = d.game;
        gameMeta = g;
        $("whiteName").textContent = g.player_white || "White";
        $("blackName").textContent = g.player_black || "Black";
        $("result").textContent = (g.result || "") + (g.winner ? " — winner: " + g.winner : "");
        moves = (g.moves || "").trim().split(/\s+/).filter(Boolean);
        try { moveTimes = JSON.parse(g.move_times || "[]"); } catch(e) { moveTimes = []; }
        renderMoveList();
        render();
      } catch (e) {
        $("result").textContent = "Failed to load";
      }
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
      if (e.key === " ") { e.preventDefault(); togglePlay(); }
    });

    load();
  </script>
</body>
</html>
