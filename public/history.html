<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess — Live & History</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============ NEW PREMIUM LAYOUT ============ */
    body { background: #0a0d14; color: #fff; display: flex; min-height: 100vh; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 240px; background: rgba(14, 18, 27, 0.9); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 24px 0; z-index: 10; }
    .sidebar .brand { padding: 0 24px 32px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; }
    .sidebar .brand-mark { color: #22c55e; font-size: 28px; }
    .nav-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; color: #8a94a6; font-weight: 500; text-decoration: none; transition: all 0.2s; cursor: pointer; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.03); }
    .nav-item.active { color: #fff; background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; font-weight: 600; }
    .nav-item svg { width: 18px; height: 18px; }
    .sidebar-footer { margin-top: auto; padding: 24px; color: #4a5568; font-size: 12px; line-height: 1.5; }

    /* Main Content */
    .main-content { flex: 1; padding: 40px; overflow-y: auto; position: relative; background: radial-gradient(circle at top right, rgba(34, 197, 94, 0.15), transparent 40%); }
    
    /* Header */
    .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
    .header-title { text-align: center; flex: 1; }
    .header-title .eyebrow { display: inline-block; padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(34, 197, 94, 0.3); color: #22c55e; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .header-title h1 { margin: 0; font-size: 42px; font-weight: 800; letter-spacing: -1px; }
    .header-title h1 span { color: #22c55e; }
    .header-title .underline { width: 60px; height: 3px; background: #22c55e; margin: 16px auto 0; border-radius: 2px; }
    .user-profile { width: 40px; height: 40px; border-radius: 50%; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); display: flex; align-items: center; justify-content: center; color: #22c55e; }
    
    /* Tabs */
    .tabs-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .tabs { display: flex; background: rgba(14, 18, 27, 0.6); padding: 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .tab { padding: 8px 20px; border-radius: 8px; border: none; background: transparent; color: #8a94a6; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .tab:hover { color: #fff; }
    .tab.active { background: #22c55e; color: #000; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2); }
    .btn-clear { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-clear:hover { background: rgba(239, 68, 68, 0.2); }

    /* Table Headers */
    .table-head { display: grid; grid-template-columns: 80px 1fr 1fr 1fr 80px 140px 140px; gap: 16px; padding: 0 20px; font-size: 11px; font-weight: 700; color: #4a5568; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    
    /* Game Cards */
    .game-card { background: rgba(20, 26, 38, 0.6); border: 1px solid rgba(255,255,255,0.04); border-radius: 16px; margin-bottom: 16px; overflow: hidden; transition: all 0.2s; position: relative; }
    .game-card:hover { background: rgba(26, 34, 49, 0.8); border-color: rgba(34, 197, 94, 0.3); }
    .game-card.active-game { border-left: 3px solid #22c55e; }
    
    .game-row { display: grid; grid-template-columns: 80px 1fr 1fr 1fr 80px 140px 140px; gap: 16px; padding: 20px; align-items: center; font-size: 14px; }
    .game-row > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-row .code { font-family: monospace; color: #22c55e; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
    .game-row .winner { color: #22c55e; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .game-row .winner.draw { color: #8a94a6; }
    .game-row .date { color: #8a94a6; font-size: 13px; }
    .game-row .time { color: #fff; font-weight: 500; font-size: 15px; }
    
    /* Actions */
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #8a94a6; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .icon-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .icon-btn.delete:hover { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); }
    
    /* Sub-row (Moves & Replay) */
    .sub-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.03); }
    .moves-info { color: #8a94a6; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .action-btns { display: flex; gap: 12px; }
    
    .btn-replay, .btn-moves { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-replay { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
    .btn-replay:hover { background: rgba(34, 197, 94, 0.2); }
    .btn-moves { background: transparent; color: #8a94a6; border: 1px solid rgba(255,255,255,0.1); }
    .btn-moves:hover { background: rgba(255,255,255,0.05); color: #fff; }
    
    .moves-detail { padding: 16px 20px; background: rgba(0,0,0,0.4); font-family: monospace; font-size: 13px; color: #8a94a6; line-height: 1.8; word-break: break-word; border-top: 1px solid rgba(255,255,255,0.03); }
    .empty { text-align: center; padding: 60px 20px; color: #8a94a6; font-size: 15px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 16px; background: rgba(20, 26, 38, 0.3); }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      body { flex-direction: column; overflow: auto; }
      .sidebar { width: 100%; padding: 16px; flex-direction: row; justify-content: space-between; align-items: center; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
      .sidebar .brand { padding: 0; }
      .nav-item { display: none; }
      .main-content { padding: 20px; }
      .game-row { grid-template-columns: 1fr; gap: 12px; }
      .table-head { display: none; }
      .actions { justify-content: flex-start; margin-top: 10px; }
      .sub-row { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  
    /* Dropdown Menu Styles */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 8px;
      background: #1f2716;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
      min-width: 140px;
      overflow: hidden;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.05); }
    .dropdown-item.delete { color: #ef4444; }
    .dropdown-item.delete:hover { background: rgba(239,68,68,0.1); }

</style>

<style>
/* =========================================
   CHESS HISTORY — PROFESSIONAL MOBILE DESIGN
   Desktop remains unchanged
========================================= */

@media (max-width: 700px) {

    #history {
        width: 100%;
        overflow: visible;
    }

    /* Hide desktop table headings */
    #history .table-head {
        display: none !important;
    }

    /* Game card */
    #history .game-card {
        display: block !important;
        width: 100%;
        margin: 0 0 13px;
        padding: 0;
        overflow: visible;
        background: linear-gradient(145deg, #111d27, #0d1821);
        border: 1px solid #263945;
        border-radius: 15px;
        box-shadow: 0 5px 16px rgba(0,0,0,.16);
    }

    /* Main information grid */
    #history .game-row {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 13px 12px;
        padding: 15px;
        align-items: center;
    }

    /* Game code */
    #history .game-row .code {
        grid-column: 1;
        grid-row: 1;
        font-size: 14px;
        font-weight: 850;
        color: #42e69b;
        letter-spacing: .7px;
    }

    /* Action dropdown */
    #history .game-row .actions {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        display: flex;
        justify-content: flex-end;
    }

    /* Information fields */
    #history .game-row > span:not(.code) {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        font-size: 13px;
        color: #e5edf2;
        overflow-wrap: anywhere;
    }

    /* White player */
    #history .game-row > span:nth-child(2)::before {
        content: "WHITE";
        color: #8298a8;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    /* Black player */
    #history .game-row > span:nth-child(3)::before {
        content: "BLACK";
        color: #8298a8;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    /* Winner */
    #history .game-row > span:nth-child(4)::before {
        content: "WINNER";
        color: #8298a8;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    /* Time */
    #history .game-row > span:nth-child(5)::before {
        content: "DURATION";
        color: #8298a8;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    /* Date */
    #history .game-row > span:nth-child(6) {
        grid-column: 1 / -1;
        border-top: 1px solid #23343f;
        padding-top: 10px;
        color: #91a9bb;
        font-size: 11px;
    }

    #history .game-row > span:nth-child(6)::before {
        content: "PLAYED ON";
        color: #8298a8;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    /* Winner colors */
    #history .winner.white {
        color: #48e8a0 !important;
        font-weight: 750;
    }

    #history .winner.black {
        color: #65b9ff !important;
        font-weight: 750;
    }

    #history .winner.draw {
        color: #a9b6c2 !important;
    }

    /* Dropdown */
    #history .dropdown {
        position: relative;
        z-index: 3;
    }

    #history .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
    }

    #history .dropdown-menu {
        right: 0;
        left: auto;
        z-index: 20;
    }

    /* Bottom action section */
    #history .sub-row {
        display: flex !important;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 12px 15px 14px;
        border-top: 1px solid #263945;
        background: rgba(5, 14, 20, .3);
        border-radius: 0 0 15px 15px;
    }

    #history .moves-info {
        color: #9db0bd;
        font-size: 12px;
    }

    /* Replay and moves buttons */
    #history .action-btns {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        width: 100%;
    }

    #history .action-btns .btn-replay,
    #history .action-btns .btn-moves {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 40px;
        padding: 8px 5px;
        border-radius: 10px;
        font-size: 12px;
        white-space: nowrap;
        text-align: center;
    }

    #history .moves-detail {
        padding: 12px 15px;
        line-height: 1.9;
        font-size: 12px;
        overflow-wrap: anywhere;
        word-break: normal;
        border-top: 1px solid #263945;
        color: #b9cbd5;
    }

    #history .moves-detail.hidden {
        display: none !important;
    }
}
</style>

    <!-- Live Games -->

      <div class="table-head"><span>Code</span><span>White</span><span>Black</span><span>Turn</span><span>Moves</span><span style="text-align:right;">Watch</span><span style="text-align:right; padding-right: 15px;">Action</span></div>
      <div id="liveBody"><div class="empty">Loading...</div></div>
    </div>

    <!-- History -->
    <div id="history" class="hidden">
      <div class="table-head"><span>Code</span><span>White</span><span>Black</span><span>Winner</span><span>Time</span><span>Date</span><span style="text-align:right;">Action</span></div>
      <div id="historyBody"><div class="empty">Loading...</div></div>
    </div>

    <!-- Archived -->
    <div id="archived" class="hidden">
      <div class="table-head"><span>Code</span><span>White</span><span>Black</span><span>Winner</span><span>Time</span><span>Date</span><span style="text-align:right;">Restore</span></div>
      <div id="archivedBody"><div class="empty">Loading...</div></div>
    </div>
  </main>

  <script>
    // ============ MODAL ============
    function cModal({ title, message, okText, cancelText, danger = false, confirmOnly = false, isPassword = false }) {
      const isAr = document.cookie.split('; ').some(c => c === 'lang=ar');
      const bg = document.createElement("div");
      bg.className = "chess-modal-backdrop open";
      bg.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;";
      bg.innerHTML = '<div class="chess-modal" dir="' + (isAr ? 'rtl' : 'ltr') + '" style="background:#141a26;border:1px solid rgba(255,255,255,0.1);border-radius:16px;max-width:400px;width:100%;padding:24px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,0.6);">' +
        '<h3 style="margin:0 0 8px;font-size:20px;font-weight:700;">' + (title || 'Confirm') + '</h3>' +
        '<p style="margin:0 0 20px;font-size:14px;color:#8a94a6;line-height:1.5;">' + (message || '') + '</p>' +
        (isPassword ? '<input type="password" id="modalPass" placeholder="Password" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.2);color:#fff;margin-bottom:16px;outline:none;">' : '') +
        '<div style="display:flex;gap:10px;justify-content:flex-end;">' +
        (confirmOnly ? '' : '<button class="btn-cancel" data-action="cancel" style="padding:10px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#8a94a6;font-weight:600;cursor:pointer;">Cancel</button>') +
        '<button class="btn-ok" data-action="ok" style="padding:10px 16px;border-radius:8px;border:none;background:' + (danger ? '#ef4444' : '#22c55e') + ';color:#000;font-weight:600;cursor:pointer;">' + (okText || 'OK') + '</button>' +
        '</div></div>';
      document.body.appendChild(bg);
      
      if (isPassword) {
        const inp = bg.querySelector("#modalPass");
        if(inp) setTimeout(() => inp.focus(), 50);
      }
      
      return new Promise(function(resolve) {
        bg.addEventListener('click', function(e) {
          var btn = e.target.closest('[data-action]');
          if (btn) { 
            if (btn.dataset.action === 'ok' && isPassword) {
                const val = bg.querySelector("#modalPass")?.value || "";
                bg.remove(); resolve(val); return;
            }
            bg.remove(); resolve(btn.dataset.action === 'ok'); 
          }
          else if (e.target === bg) { bg.remove(); resolve(false); }
        });
      });
    }

    // ============ TABS ============
    
    function switchTab(which) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const targetBtn = Array.from(document.querySelectorAll('.tab')).find(t => t.getAttribute('onclick').includes(which));
      if(targetBtn) targetBtn.classList.add('active');
      
      document.getElementById('live').classList.toggle('hidden', which !== 'live');
      document.getElementById('history').classList.toggle('hidden', which !== 'history');
      document.getElementById('archived').classList.toggle('hidden', which !== 'archived');
      
      const clearBtn = document.getElementById('clearAllBtn');
      if (which === 'history') { clearBtn.classList.remove('hidden'); clearBtn.style.display = 'flex'; }
      else { clearBtn.classList.add('hidden'); clearBtn.style.display = 'none'; }

      // --- SYNC SIDEBAR AND URL HASH ---
      window.location.hash = which;
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
      const activeLink = document.getElementById('nav-' + which);
      if (activeLink) activeLink.classList.add('active');
    }


    // ============ HELPERS ============
    function fmt(sec) { if(typeof sec !== 'number') return '—'; return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
    function fmtDate(iso) {
      if(!iso) return '—';
      try {
        const d = new Date(iso);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      } catch(e) { return '—'; }
    }

    // ============ RENDERERS ============
    async function loadLive(){
      try{
        const res = await fetch('/api/games/live?_t=' + Date.now()); const d = await res.json();
        const b = document.getElementById('liveBody');
        if(!d.live || d.live.length === 0) { b.innerHTML = '<div class="empty">No live games right now.</div>'; return; }
        b.innerHTML = d.live.map(g => `
          <div class="game-card">
            <div class="game-row" onclick="window.location.href='/watch.html?code=${g.code}'" style="cursor:pointer;">
              <span class="code">${g.code}</span>
              <span>${g.white}</span>
              <span>${g.black}</span>
              <span><span style="color:#22c55e;background:rgba(34,197,94,.1);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.5px;">${g.turn==='w'?'WHITE':'BLACK'}</span></span>
              <span>${g.moves} moves</span>
              <span style="color:#22c55e;font-weight:600;text-align:right;">👁 Watch</span>
              <span style="text-align:right; padding-right: 15px;">
                <button onclick="event.stopPropagation(); forceDeleteLive('${g.code}')" class="icon-btn delete" title="Force Finish Game" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); width: 32px; height: 32px;">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </span>
            </div>
          </div>`).join('');
      } catch(e) { document.getElementById('liveBody').innerHTML = '<div class="empty">Failed to load.</div>'; }
    }

    async function loadHistory(){
      try{
        const res = await fetch('/api/games?limit=50'); const d = await res.json();
        const b = document.getElementById('historyBody');
        if(!d.games || d.games.length === 0) { b.innerHTML = '<div class="empty">No games finished yet.</div>'; return; }
        
        b.innerHTML = d.games.map((g,i) => {
          let label='—', cls='draw';
          if(g.winner === 'white') { label=g.player_white; cls='white'; }
          else if(g.winner === 'black') { label=g.player_black; cls='black'; }
          else if(g.result === 'draw') { label='Draw'; }
          
          const moves = (g.moves||'').trim();
          const moveCount = moves ? moves.split(/\s+/).length : 0;
          
          return `
            <div class="game-card">
              <div class="game-row">
                <span class="code">${g.code}</span>
                <span>${g.player_white}</span>
                <span>${g.player_black}</span>
                <span class="winner ${cls}">${label !== '—' && label !== 'Draw' ? '♛ ' : ''}${label}</span>
                <span class="time">${fmt(g.duration_seconds)}</span>
                <span class="date">${fmtDate(g.started_at)}</span>
                <div class="actions">
                  <div class="dropdown">
                    <button class="icon-btn" onclick="toggleDropdown(event, ${g.id})" title="More options">⋮</button>
                    <div class="dropdown-menu" id="dropdown-${g.id}">
                      <button class="dropdown-item" onclick="archiveGame(${g.id})">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                        Archive
                      </button>
                      <button class="dropdown-item delete" onclick="deleteGame(${g.id})">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        Delete
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="sub-row">
                <span class="moves-info">♟️ ${moveCount} moves · ${g.result}</span>
                <div class="action-btns">
                  <a href="/replay.html?id=${g.id}" class="btn-replay">▶ Replay</a>
                  ${moves ? `<button class="btn-moves" onclick="toggleMoves('h-${i}')">≡ Show moves</button>` : ''}
                </div>
              </div>
              ${moves ? `<div id="h-${i}" class="moves-detail hidden">${moves}</div>` : ''}
            </div>
          `;
        }).join('');
      } catch(e) { document.getElementById('historyBody').innerHTML = '<div class="empty">Failed to load.</div>'; }
    }

    async function loadArchived(){
      try{
        const res = await fetch('/api/games/archived'); const d = await res.json();
        const b = document.getElementById('archivedBody');
        if(!d.games || d.games.length === 0) { b.innerHTML = '<div class="empty">No archived games.</div>'; return; }
        
        b.innerHTML = d.games.map((g,i) => {
          let label='—', cls='draw';
          if(g.winner === 'white') { label=g.player_white; cls='white'; }
          else if(g.winner === 'black') { label=g.player_black; cls='black'; }
          else if(g.result === 'draw') { label='Draw'; }
          
          const moves = (g.moves||'').trim();
          const moveCount = moves ? moves.split(/\s+/).length : 0;
          
          return `
            <div class="game-card">
              <div class="game-row">
                <span class="code">${g.code}</span>
                <span>${g.player_white}</span>
                <span>${g.player_black}</span>
                <span class="winner ${cls}">${label !== '—' && label !== 'Draw' ? '♛ ' : ''}${label}</span>
                <span class="time">${fmt(g.duration_seconds)}</span>
                <span class="date">${fmtDate(g.started_at)}</span>
                <div class="actions">
                  <button class="btn-replay" onclick="restoreGame(${g.id})">↻ Restore</button>
                </div>
              </div>
              <div class="sub-row">
                <span class="moves-info">♟️ ${moveCount} moves · ${g.result}</span>
                <div class="action-btns">
                  ${moves ? `<button class="btn-moves" onclick="toggleMoves('a-${i}')">≡ Show moves</button>` : ''}
                </div>
              </div>
              ${moves ? `<div id="a-${i}" class="moves-detail hidden">${moves}</div>` : ''}
            </div>
          `;
        }).join('');
      } catch(e) { document.getElementById('archivedBody').innerHTML = '<div class="empty">Failed to load.</div>'; }
    }

    // ============ ACTIONS ============
    function toggleMoves(id){
      const el = document.getElementById(id);
      if(el) el.classList.toggle('hidden');
    }

    async function archiveGame(id) {
      const pass = await cModal({ title: "Admin Required", message: "Enter password to archive this game:", isPassword: true, danger: false, okText: "Archive" });
      if (!pass) return;
      
      try {
        const r = await fetch("/api/games/" + id, { method: "PATCH", headers: { "Authorization": "Basic " + btoa("admin:" + pass) } });
        if (r.ok) { loadHistory(); loadArchived(); }
        else if (r.status === 401) { await cModal({ title: "Error", message: "Incorrect password!", confirmOnly: true }); }
        else { await cModal({ title: "Error", message: "Archive failed", confirmOnly: true }); }
      } catch(e) { await cModal({ title: "Error", message: "Archive failed", confirmOnly: true }); }
    }

    async function deleteGame(id) {
      const pass = await cModal({ title: "Admin Required", message: "Permanently delete this game?", isPassword: true, danger: true, okText: "Delete" });
      if (!pass) return;
      
      try {
        const r = await fetch("/api/games/" + id, { method: "DELETE", headers: { "Authorization": "Basic " + btoa("admin:" + pass) } });
        if (r.ok) { loadHistory(); loadArchived(); }
        else if (r.status === 401) { await cModal({ title: "Error", message: "Incorrect password!", confirmOnly: true }); }
        else { await cModal({ title: "Error", message: "Delete failed", confirmOnly: true }); }
      } catch(e) { await cModal({ title: "Error", message: "Delete failed", confirmOnly: true }); }
    }

    async function restoreGame(id) {
      const pass = await cModal({ title: "Admin Required", message: "Enter password to restore this game:", isPassword: true, danger: false, okText: "Restore" });
      if (!pass) return;
      
      try {
        const r = await fetch("/api/games/restore/" + id, { method: "PATCH", headers: { "Authorization": "Basic " + btoa("admin:" + pass) } });
        if (r.ok) { loadHistory(); loadArchived(); }
        else if (r.status === 401) { await cModal({ title: "Error", message: "Incorrect password!", confirmOnly: true }); }
        else { await cModal({ title: "Error", message: "Restore failed", confirmOnly: true }); }
      } catch(e) { await cModal({ title: "Error", message: "Restore failed", confirmOnly: true }); }
    }

    async function clearAll() {
      const pass = await cModal({ title: "Admin Required", message: "Delete ALL history permanently?", isPassword: true, danger: true, okText: "Delete All" });
      if (!pass) return;

      try {
        const r = await fetch("/api/games", { method: "DELETE", headers: { "Authorization": "Basic " + btoa("admin:" + pass) } });
        if (r.ok) { loadHistory(); loadArchived(); }
        else if (r.status === 401) { await cModal({ title: "Error", message: "Incorrect password!", confirmOnly: true }); }
        else { await cModal({ title: "Error", message: "Clear failed", confirmOnly: true }); }
      } catch(e) { await cModal({ title: "Error", message: "Clear failed", confirmOnly: true }); }
    }

    
    // ============ DROPDOWN LOGIC ============
    function toggleDropdown(event, id) {
      event.stopPropagation();
      // Close all other dropdowns
      document.querySelectorAll('.dropdown-menu').forEach(menu => {
        if (menu.id !== 'dropdown-' + id) menu.classList.remove('show');
      });
      // Toggle the current one
      const menu = document.getElementById('dropdown-' + id);
      if (menu) menu.classList.toggle('show');
    }

    // Close dropdown when clicking anywhere else
    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
    });

    // ============ INIT ============
    loadLive();
    loadHistory();
    loadArchived();
    setInterval(loadLive, 5000);

    // Check URL Hash for Tab
    function checkHash() {
        const hash = window.location.hash.replace('#', '');
        if (hash === 'live' || hash === 'history' || hash === 'archived') {
            switchTab(hash);
        }
    }
    if (window.location.hash) {
        checkHash();
    } else {
        switchTab('live'); // Default to live if no hash
    }
    window.addEventListener('hashchange', checkHash);
  </script>

    
    

      <script>
        function handlePlayClick(e) {
          if(e) e.preventDefault();
          const gameSection = document.getElementById("game");
          const lobbySection = document.getElementById("lobby");
          const activeRoom = sessionStorage.getItem("chessRoomCode");
          
          if (gameSection && !gameSection.classList.contains("hidden")) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (activeRoom) {
            // Bring back the game without reloading the page
            if(lobbySection) lobbySection.classList.add("hidden");
            if(gameSection) gameSection.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            if(lobbySection) lobbySection.classList.remove("hidden");
            if(gameSection) gameSection.classList.add("hidden");
          }
        }
      </script>
    

  
  

  
  

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('hamburgerBtn');
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      if (btn && sidebar && overlay) {
        btn.addEventListener('click', () => {
          sidebar.classList.add('open');
          overlay.classList.add('open');
        });
        
        overlay.addEventListener('click', () => {
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
        });
      }
    });
  </script>
  

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Determine current page and hash
      const path = window.location.pathname;
      const hash = window.location.hash.replace('#', '');
      
      let activeId = '';
      if (path.includes('game.html')) {
        activeId = 'nav-play';
      } else if (path.includes('history.html')) {
        if (hash === 'archived') activeId = 'nav-archived';
        else if (hash === 'live') activeId = 'nav-live';
        else activeId = 'nav-history';
      } else {
        activeId = 'nav-home';
      }

      // Apply active class
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(activeId);
      if (activeEl) activeEl.classList.add('active');
      
      // If on history page, listen for tab changes to update sidebar
      if (path.includes('history.html')) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            const onclickStr = tab.getAttribute('onclick') || '';
            document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
            if (onclickStr.includes('archived')) document.getElementById('nav-archived')?.classList.add('active');
            else if (onclickStr.includes('live')) document.getElementById('nav-live')?.classList.add('active');
            else document.getElementById('nav-history')?.classList.add('active');
          });
        });
      }
    });
  </script>

        document.querySelectorAll('.tab').forEach(tab => {

            const onclickStr = tab.getAttribute('onclick') || '';

            if (onclickStr.includes('archived')) document.getElementById('nav-archived')?.classList.add('active');
            else if (onclickStr.includes('live')) document.getElementById('nav-live')?.classList.add('active');

          });

      }
    });

    <script>
    async function forceDeleteLive(code) {
        const pass = await cModal({ 
            title: "Admin Required", 
            message: "Enter password to forcefully finish this stuck game:", 
            isPassword: true, 
            danger: true, 
            okText: "Finish Game" 
        });
        if (!pass) return;
        
        try {
            const res = await fetch('/api/games/live/' + code, { 
                method: 'DELETE',
                headers: { "Authorization": "Basic " + btoa("admin:" + pass) }
            });
            
            if (res.ok) {
                // FORCE IMMEDIATE REFRESH
                loadLive(); 
            } else {
                const errorText = await res.text();
                await cModal({ title: "Error", message: "Failed: " + (errorText || res.status), confirmOnly: true });
            }
        } catch(e) {
            await cModal({ title: "Error", message: "Connection error", confirmOnly: true });
        }
    }
    </script>
