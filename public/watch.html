<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess — Watching</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .watch-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--danger);
      background: rgba(224, 104, 79, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .watch-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  </style>
<style>
    /* ============ SHARED PREMIUM UI ============ */
    body { background: #0a0d14; color: #fff; display: flex; min-height: 100vh; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 240px; background: rgba(14, 18, 27, 0.9); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 24px 0; z-index: 10; }
    .sidebar .brand { padding: 0 24px 32px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; color: #fff; text-decoration: none; }
    .sidebar .brand-mark { color: #22c55e; font-size: 28px; }
    .nav-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; color: #8a94a6; font-weight: 500; text-decoration: none; transition: all 0.2s; cursor: pointer; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.03); }
    .nav-item.active { color: #fff; background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; font-weight: 600; }
    .nav-item svg { width: 18px; height: 18px; }
    .sidebar-footer { margin-top: auto; padding: 24px; color: #4a5568; font-size: 12px; line-height: 1.5; }

    /* Main Content */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; background: radial-gradient(circle at top right, rgba(34, 197, 94, 0.15), transparent 40%); display: flex; flex-direction: column; }
    
    .user-profile { position: absolute; top: 30px; right: 30px; width: 40px; height: 40px; border-radius: 50%; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); display: flex; align-items: center; justify-content: center; color: #22c55e; z-index: 20; }

    /* Fix Layout inside new Main */
    .layout { max-width: 1120px; margin: 0 auto; width: 100%; padding: 0; flex: 1; display: flex; flex-direction: column; }
    
    /* Panels */
    .panel { background: rgba(20, 26, 38, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .panel-head { border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
    .panel-head .label { color: #8a94a6; }
    
    /* Buttons */
    .btn-primary { background: #22c55e; color: #000; border: none; font-weight: 700; }
    .btn-primary:hover { background: #16a34a; }
    .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    
    .text-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; }
    .text-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
    
    /* Mobile */
    @media (max-width: 900px) {
      body { flex-direction: column; overflow: auto; }
      .sidebar { width: 100%; padding: 16px; flex-direction: row; justify-content: space-between; align-items: center; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
      .sidebar .brand { padding: 0; }
      .nav-item { display: none; }
      .main-content { padding: 20px; }
      .user-profile { display: none; }
    }
</style>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/chess.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = (params.get("code") || "").toUpperCase();
    const $ = id => document.getElementById(id);
    function cModal({ title, message, okText, cancelText, danger = false }) {
      const isAr = document.cookie.split('; ').some(c => c === 'lang=ar');
      const bg = document.createElement("div");
      bg.className = "chess-modal-backdrop open";
      bg.innerHTML = '<div class="chess-modal" dir="' + (isAr ? 'rtl' : 'ltr') + '"><h3>' + (title || (isAr ? 'تأكيد' : 'Confirm')) + '</h3><p>' + (message || '') + '</p><div class="chess-modal-actions">' + (cancelText !== null ? '<button class="chess-modal-btn" data-action="cancel">' + (cancelText || (isAr ? 'إلغاء' : 'Cancel')) + '</button>' : '') + '<button class="chess-modal-btn ' + (danger ? 'danger' : 'primary') + '" data-action="ok">' + (okText || (isAr ? 'موافق' : 'OK')) + '</button></div></div>';
      document.body.appendChild(bg);
      return new Promise(function(resolve) {
        bg.addEventListener('click', function(e) {
          var btn = e.target.closest('[data-action]');
          if (btn) { bg.remove(); resolve(btn.dataset.action === 'ok'); }
          else if (e.target === bg) { bg.remove(); resolve(false); }
        });
      });
    }
    const socket = io();
    const PIECES = {
    wk: "/pieces/cburnett/wK.svg",
    wq: "/pieces/cburnett/wQ.svg",
    wr: "/pieces/cburnett/wR.svg",
    wb: "/pieces/cburnett/wB.svg",
    wn: "/pieces/cburnett/wN.svg",
    wp: "/pieces/cburnett/wP.svg",
    bk: "/pieces/cburnett/bK.svg",
    bq: "/pieces/cburnett/bQ.svg",
    br: "/pieces/cburnett/bR.svg",
    bb: "/pieces/cburnett/bB.svg",
    bn: "/pieces/cburnett/bN.svg",
    bp: "/pieces/cburnett/bP.svg",
  };
    let state = { game: null, color: "spectator" };

    function renderBoard(game) {
      const boardEl = $("board");
      boardEl.innerHTML = "";
      const fenRows = game.board();
      const boardMap = {};
      fenRows.forEach((row, ri) => row.forEach((p, fi) => {
        if (p) boardMap["abcdefgh"[fi] + (8 - ri)] = p;
      }));
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const square = "abcdefgh"[f] + (8 - r);
          const piece = boardMap[square];
          const fileIndex = f;
          const rank = 8 - r;
          const light = (fileIndex + rank) % 2 === 0;
          const cell = document.createElement("div");
          cell.className = "square " + (light ? "light" : "dark");
          if (piece) {
            const span = document.createElement("span");
            span.className = "piece " + (piece.color === "w" ? "white" : "black");
            span.innerHTML = `<img src="${PIECES[piece.color + piece.type]}" alt="" style="width:100%;height:100%;object-fit:contain;pointer-events:none" />`;
            cell.appendChild(span);
          }
          if ((typeof game.inCheck === "function" ? game.inCheck() : game.in_check && game.in_check()) && piece && piece.type === "k" && piece.color === game.turn()) {
            cell.classList.add("checked-king");
          }
          boardEl.appendChild(cell);
        }
      }
    }

    function renderHistory(history) {
      const list = $("moveList");
      list.innerHTML = "";
      if (!history.length) {
        list.innerHTML = '<div class="empty-moves">No moves yet</div>';
      } else {
        for (let i = 0; i < history.length; i += 2) {
          const pair = document.createElement("div");
          pair.className = "move-pair";
          pair.innerHTML =
            `<span class="move-no">${Math.floor(i/2)+1}.</span>` +
            `<span class="move-san${i===history.length-1?' latest':''}">${history[i].san}</span>` +
            `<span class="move-san${i+1===history.length-1?' latest':''}">${history[i+1]?.san || ''}</span>`;
          list.appendChild(pair);
        }
        list.scrollTop = list.scrollHeight;
      }
      $("moveCount").textContent = history.length + " moves";
    }

    function fmt(sec) {
      if (typeof sec !== "number") return "10:00";
      return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
    }

    function render(s) {
      if (!s) return;
      $("roomCodeLabel").textContent = s.code;
      $("whiteName").textContent = s.players.w?.name || "White";
      $("blackName").textContent = s.players.b?.name || "Black";
      $("whiteTime").textContent = fmt(s.timeLeft?.w);
      $("blackTime").textContent = fmt(s.timeLeft?.b);
      try { state.game = new Chess(s.fen); } catch(e) { return; }
      renderBoard(state.game);
      renderHistory(s.history);
      const turnLabel = s.turn === "w" ? "White to move" : "Black to move";
      $("turnIndicator").innerHTML = '<i class="turn-dot"></i> ' + turnLabel;
      $("statusTitle").textContent = s.status === "playing" ? (s.turn === "w" ? "White to move" : "Black to move") : s.status;
      $("statusDescription").textContent = "Watching in real time";
    }

    socket.on("connect", () => {
      $("connStatus").textContent = "Connected";
      if (code) socket.emit("spectate", { code });
    });
    socket.on("spectating", ({ code: c, state: s }) => render(s));
    socket.on("state", s => { if (s && s.code === code) render(s); });
    socket.on("clock", ({ timeLeft }) => {
      $("whiteTime").textContent = fmt(timeLeft.w);
      $("blackTime").textContent = fmt(timeLeft.b);
    });
    socket.on("gameError", msg => { $("connStatus").textContent = msg; });
  </script>
</main>

        function handlePlayClick(e) {
          if(e) e.preventDefault();
          const gameSection = document.getElementById("game");
          const lobbySection = document.getElementById("lobby");
          const activeRoom = sessionStorage.getItem("chessRoomCode");
          
          if (gameSection && !gameSection.classList.contains("hidden")) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (activeRoom) {
            // Bring back the game without reloading the page
            if(lobbySection) lobbySection.classList.add("hidden");
            if(gameSection) gameSection.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            if(lobbySection) lobbySection.classList.remove("hidden");
            if(gameSection) gameSection.classList.add("hidden");
          }
        }
      </script>
    

  
  

  
  

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('hamburgerBtn');
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      if (btn && sidebar && overlay) {
        btn.addEventListener('click', () => {
          sidebar.classList.add('open');
          overlay.classList.add('open');
        });
        
        overlay.addEventListener('click', () => {
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
        });
      }
    });
  </script>
  

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Determine current page and hash
      const path = window.location.pathname;
      const hash = window.location.hash.replace('#', '');
      
      let activeId = '';
      if (path.includes('game.html')) {
        activeId = 'nav-play';
      } else if (path.includes('history.html')) {
        if (hash === 'archived') activeId = 'nav-archived';
        else if (hash === 'live') activeId = 'nav-live';
        else activeId = 'nav-history';
      } else {
        activeId = 'nav-home';
      }

      // Apply active class
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(activeId);
      if (activeEl) activeEl.classList.add('active');
      
      // If on history page, listen for tab changes to update sidebar
      if (path.includes('history.html')) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            const onclickStr = tab.getAttribute('onclick') || '';
            document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
            if (onclickStr.includes('archived')) document.getElementById('nav-archived')?.classList.add('active');
            else if (onclickStr.includes('live')) document.getElementById('nav-live')?.classList.add('active');
            else document.getElementById('nav-history')?.classList.add('active');
          });
        });
      }
    });
  </script>

  <script>
    // Global check for running game
    document.addEventListener('DOMContentLoaded', () => {
      const savedCode = sessionStorage.getItem("chessRoomCode");
      if (savedCode && !window.location.pathname.includes("game.html")) {
          document.body.classList.add("has-active-game");
          const dot = document.querySelector('.running-dot');
          if (dot) dot.style.display = 'inline-block';
      }
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const path = window.location.pathname;
      const hash = window.location.hash.replace('#', '');
      
      // Remove active from all items first
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));

      // Determine which one should be active
      let activeId = 'nav-home'; // Default
      
      if (path.includes('game.html')) {
        activeId = 'nav-play';
      } else if (path.includes('history.html')) {
        if (hash === 'archived') activeId = 'nav-archived';
        else if (hash === 'live') activeId = 'nav-live';
        else activeId = 'nav-history'; // Default history tab
      } else if (path === '/' || path.includes('index.html')) {
        activeId = 'nav-home';
      } else if (path.includes('replay.html') || path.includes('watch.html')) {
        activeId = 'nav-history'; // Replays belong to history
      }

      // Apply active class
      const activeEl = document.getElementById(activeId);
      if (activeEl) activeEl.classList.add('active');

      // If on history page, listen for tab clicks to update sidebar
      if (path.includes('history.html')) {
        document.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => {
            const onclickStr = tab.getAttribute('onclick') || '';
            document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
            if (onclickStr.includes('archived')) document.getElementById('nav-archived')?.classList.add('active');
            else if (onclickStr.includes('live')) document.getElementById('nav-live')?.classList.add('active');
            else document.getElementById('nav-history')?.classList.add('active');
          });
        });
      }
    });
  </script>
